name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например, 1.0.0)'
        required: true
        type: string
      notes:
        description: 'Описание релиза'
        required: false
        type: string
        default: ''

env:
  # Для постквантовых получателей age1pq1 нужен age >= 1.3.0.
  # Проверить наличие и поднять: github.com/FiloSottile/age/releases
  AGE_VERSION: v1.2.1

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: macos-latest
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (latest)
        shell: bash
        run: |
          pip install -e . pyinstaller

      - name: Create mirrors list
        shell: bash
        run: |
          cat > mirrors.txt << 'EOF'
          https://ghproxy.net/
          https://ghfast.top/
          https://gh-proxy.org/
          EOF

      - name: Fetch age binary
        shell: bash
        run: |
          set -euo pipefail
          V="${AGE_VERSION}"
          P="${{ matrix.platform }}"
          A="${{ matrix.arch }}"
          case "$P" in
            windows) PKG="age-${V}-windows-${A}.zip" ;;
            macos)   PKG="age-${V}-darwin-${A}.tar.gz" ;;
            *)       PKG="age-${V}-linux-${A}.tar.gz" ;;
          esac
          URL="https://github.com/FiloSottile/age/releases/download/${V}/${PKG}"
          echo "Downloading $URL"
          curl -fsSL --retry 3 --retry-delay 2 -o "$PKG" "$URL"
          mkdir -p age-extract age-dist
          if [ "$P" = "windows" ]; then
            7z x "$PKG" -oage-extract >/dev/null
            cp age-extract/age/age.exe age-dist/age.exe
          else
            tar -xzf "$PKG" -C age-extract
            cp age-extract/age/age age-dist/age
            chmod +x age-dist/age
          fi
          ls -la age-dist/

      - name: Create macOS starter
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # sudo -E, а не osascript из main.py: do shell script запускает
          # процесс с пайпами вместо терминала, и TUI без TTY не поднимется.
          # xattr -dr снимает карантин РЕКУРСИВНО — в том числе с age.
          printf '#!/bin/bash\ncd "$(dirname "$0")" || exit 1\nchmod +x ./Varekai ./age 2>/dev/null\nxattr -dr com.apple.quarantine . 2>/dev/null\nexec sudo -E ./Varekai\n' > START.command
          chmod +x START.command

      - name: Embed version into build
        shell: bash
        run: |
          python - <<'EOF'
          import pathlib
          import re
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          version = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M).group(1)
          pathlib.Path("_build_version.py").write_text(
              f'BUILD_VERSION = "{version}"\n', encoding="utf-8"
          )
          print("Embedded version:", version)
          EOF

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            pyinstaller --onedir --name Varekai \
              --hidden-import _build_version main.py
            mkdir -p dist/varekai-client
            mv dist/Varekai/* dist/varekai-client/
            cp age-dist/age dist/varekai-client/age
            BUNDLE=dist/varekai-client

            # Подпись ИЗНУТРИ НАРУЖУ. --deep на голом Mach-O вложенный
            # код не обходит: переподписывался только исполняемый файл.
            find "$BUNDLE" -type f \
              \( -name '*.so' -o -name '*.dylib' -o -name 'Python' \
                 -o -name 'Varekai' \) -print0 |
              while IFS= read -r -d '' f; do
                codesign --remove-signature "$f" 2>/dev/null || true
              done

            find "$BUNDLE/_internal" -type f \
              \( -name '*.so' -o -name '*.dylib' \) -print0 |
              while IFS= read -r -d '' f; do
                codesign --force --timestamp=none --sign - "$f"
              done

            find "$BUNDLE/_internal" -maxdepth 1 -name '*.framework' -print0 |
              while IFS= read -r -d '' fw; do
                codesign --force --timestamp=none --sign - "$fw"
              done

            # Bundled age — тоже подписываем, иначе Gatekeeper его не пустит.
            codesign --force --timestamp=none --sign - "$BUNDLE/age"
            codesign --force --timestamp=none --sign - "$BUNDLE/Varekai"

            codesign --verify --strict --verbose=2 "$BUNDLE/age"
            codesign --verify --strict --verbose=2 "$BUNDLE/Varekai"
            if [ -d "$BUNDLE/_internal/Python.framework" ]; then
              codesign --verify --deep --strict --verbose=2 \
                "$BUNDLE/_internal/Python.framework"
            fi
          else
            pyinstaller --onedir --name varekai-client --hidden-import _build_version --icon app.ico main.py
            if [ "${{ matrix.platform }}" = "windows" ]; then
              mv dist/varekai-client/varekai-client.exe dist/varekai-client/START.exe
              ls -la wintun.dll 2>/dev/null || echo "WARNING: wintun.dll not found in workspace"
              cp wintun.dll dist/varekai-client/ 2>/dev/null || echo "WARNING: failed to copy wintun.dll"
              cp age-dist/age.exe dist/varekai-client/age.exe
            else
              mv dist/varekai-client/varekai-client dist/varekai-client/Varekai
              cp age-dist/age dist/varekai-client/age
            fi
          fi
          cp mirrors.txt dist/varekai-client/
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cp START.command dist/varekai-client/
          fi

      - name: Verify bundled age runs
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            ./dist/varekai-client/age.exe --version
          else
            ./dist/varekai-client/age --version
          fi

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a ../varekai-client-${{ matrix.platform }}-${{ matrix.arch }}-v${{ inputs.version }}.zip varekai-client/
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            hdiutil create -srcfolder varekai-client -volname "Varekai Client" -fs HFS+ -format UDZO -ov ../varekai-client-${{ matrix.platform }}-${{ matrix.arch }}-v${{ inputs.version }}.dmg
          else
            tar -czf ../varekai-client-${{ matrix.platform }}-${{ matrix.arch }}-v${{ inputs.version }}.tar.gz varekai-client/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: varekai-client-${{ matrix.platform }}-${{ matrix.arch }}
          path: varekai-client-${{ matrix.platform }}-${{ matrix.arch }}-v${{ inputs.version }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version exists
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ inputs.version }}"; then
            echo "::error::Версия v${{ inputs.version }} уже существует. Укажите новую версию."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts (debug)
        run: find artifacts -type f

      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Varekai Client v${{ inputs.version }}
          body: ${{ inputs.notes }}
          draft: true
          files: artifacts/*
