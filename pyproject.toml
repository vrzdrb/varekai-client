[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varekai-client"
version = "0.9.9f"
description = "Cross-platform TUI launcher for prizrak-core/mihomo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "textual",
    "httpx",
    "requests",
    "ruamel.yaml",
    "cryptography",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
py-modules = [
    "main",
    "utils",
    "config",
    "core",
    "clash_api",
    "sub_meta",
    "sub_client",
    "age_crypto",
    "tui",
    "tui_app",
    "tui_widgets",
    "tui_connections",
    "tui_rollback",
    "tui_routing",
    "user_routing",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py39"
# Мягкий конфиг: только явные проблемы, без стилистического пресса.

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
